<title id="title">Appeal architecture: local demo and separately tested NEAR v2 path</title>
<desc id="desc">Private device storage feeds an explicit disclosure preview and case builder. A local mock ledger backs the current phone demo. The worker-signed SQLite relay and NEAR contract are separately tested components; phone integration and public deployment remain pending.</desc>
