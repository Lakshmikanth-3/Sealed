<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
<title id="title">Appeal live-only architecture</title><desc id="desc">Private device records are committed through a worker wallet to the NEAR contract. Explicitly disclosed evidence is stored in expiring SQLite shares. Reviewers independently query public RPC. Private AI is separately consented and requires verified provider evidence. Deployment and actual public execution remain required.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#0f6b5c"/></marker></defs><rect width="1100" height="580" fill="#fbfaf7"/>
<g font-family="ui-monospace,Consolas,monospace" fill="#202522"><text x="40" y="45" font-size="22">APPEAL / LIVE EVIDENCE FLOW</text><text x="40" y="74" font-size="12">Code paths shown. Actual deployment and funded execution remain verification gates.</text>
<g fill="#fff" stroke="#404940" stroke-width="1.2"><rect x="40" y="140" width="220" height="110"/><rect x="310" y="140" width="220" height="110"/><rect x="580" y="140" width="220" height="110"/><rect x="850" y="140" width="220" height="110"/><rect x="40" y="370" width="220" height="110"/><rect x="310" y="370" width="220" height="110"/><rect x="580" y="370" width="220" height="110"/><rect x="850" y="370" width="220" height="110"/></g>
<text x="55" y="173" font-size="14">Private device journal</text><text x="55" y="199" font-size="11">Original screenshots</text><text x="55" y="220" font-size="11">Salted Merkle commitments</text>
<text x="325" y="173" font-size="14">Worker wallet</text><text x="325" y="199" font-size="11">Explicit transaction approval</text><text x="325" y="220" font-size="11">Persistent callback recovery</text>
<text x="595" y="173" font-size="14">Public RPC verification</text><text x="595" y="199" font-size="11">FINAL successful receipt</text><text x="595" y="220" font-size="11">Exact worker and arguments</text>
<text x="865" y="173" font-size="14">NEAR v2 contract</text><text x="865" y="199" font-size="11">Registration and ownership</text>
<text x="55" y="403" font-size="14">Disclosure preview</text><text x="55" y="429" font-size="11">Selected records and consent</text><text x="55" y="450" font-size="11">Publishing access token</text>
<text x="325" y="403" font-size="14">SQLite shared packs</text><text x="325" y="429" font-size="11">Expiry and deletion capability</text><text x="325" y="450" font-size="11">Persistent operator storage</text>
<text x="595" y="403" font-size="14">Independent reviewer</text><text x="595" y="429" font-size="11">Public RPC and local proofs</text><text x="595" y="450" font-size="11">Deterministic cited brief</text>
<text x="865" y="403" font-size="14">Private AI draft</text><text x="865" y="429" font-size="11">Opt-in / E2EE / TEE signature</text><text x="865" y="450" font-size="11">Server verifies provider proof</text>
