services:
  - type: web
    name: sealed-paper
    runtime: docker
    healthCheckPath: /api/config
    disk:
      name: sealed-paper-data
      mountPath: /var/lib/sealed-paper
      sizeGB: 1
    envVars:
      - key: NEAR_NETWORK
        value: testnet
      - key: DATA_DIR
        value: /var/lib/sealed-paper
      - key: SEAL_CONTRACT
        value: sealed.kanth_s.testnet
      - key: SEAL_OPS_ACCOUNT
        value: sealops.kanth_s.testnet
      - key: SEAL_OPS_PRIVATE_KEY
        sync: false
      - key: SEAL_ESCROW_SECRET
        sync: false
      - key: SEAL_CREATE_TOKEN
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false
